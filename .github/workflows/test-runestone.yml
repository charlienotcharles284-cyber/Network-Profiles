name: Validate Runestone
on:
  push:
    paths: ['JS/**', 'tests/**', 'scripts/**', 'Rules/service-additions.json', '.github/workflows/test-runestone.yml']
  pull_request:
    paths: ['JS/**', 'tests/**', 'scripts/**', 'Rules/service-additions.json', '.github/workflows/test-runestone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/runestone.test.cjs
      - name: Check generated personal preset
        if: hashFiles('scripts/build-personal.cjs') != ''
        run: node scripts/build-personal.cjs --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -p 'test_*.py'
